<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD - Document Flow &amp; Status Report</title>

    <style>
        /* Splash screen to prevent any flash during library loading */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #f5f6f7; z-index: 99999;
            display: flex; align-items: center; justify-content: center;
            font-family: "72", Arial, sans-serif; color: #354a5f; font-size: 14px;
        }
        #splash .dot { 
            width: 8px; height: 8px; margin: 0 4px; border-radius: 50%; 
            background: #0070f2; animation: pulse 1.2s infinite ease-in-out; display: inline-block; 
        }
        #splash .dot:nth-child(2) { animation-delay: 0.2s; }
        #splash .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse { 0%,80%,100%{opacity:.3;transform:scale(.8)} 40%{opacity:1;transform:scale(1.1)} }
    </style>

    <script id="sap-ui-bootstrap"
        src="resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.f,sap.ui.core,sap.ui.layout,sap.ui.table,sap.viz"
        data-sap-ui-resourceroots='{ "zds.sales.flow": "./" }'
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compatversion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameoptions="trusted"
        data-sap-ui-preload="async">
    </script>

    <script>
        // Remove splash once UI5 is fully initialized
        document.addEventListener("DOMContentLoaded", function () {
            var check = setInterval(function () {
                if (document.querySelector(".sapMPage,.sapFDynamicPage,.sapUiTable")) {
                    clearInterval(check);
                    var splash = document.getElementById("splash");
                    if (splash) { splash.style.opacity = "0"; setTimeout(function(){ splash.remove(); }, 300); }
                }
            }, 200);
            // Failsafe: remove after 10s no matter what
            setTimeout(function () {
                var splash = document.getElementById("splash");
                if (splash) { splash.remove(); }
            }, 10000);
        });
    </script>
</head>
<body class="sapUiBody" id="content">
    <div id="splash">
        <span>Loading</span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div data-sap-ui-component
         data-name="zds.sales.flow"
         data-id="container"
         data-settings='{"id" : "zds_sales_flow"}'
         style="height: 100vh;">
    </div>
</body>
</html>
