    <style>
        body { font-family: 'Hanken Grotesk', sans-serif; background-color: #f7f7f7; color: #1a1c1c; }
        .sap-input { border: 1px solid #d9d9d9; padding: 4px 8px; font-size: 14px; border-radius: 2px; width: 100%; }
        .sap-input:focus { border: 2px solid #0064d2; outline: none; padding: 3px 7px; }
        .sap-label { font-size: 12px; font-weight: 600; color: #424753; margin-bottom: 4px; display: block; }
        .sap-btn-primary { background-color: #0064d2; color: white; padding: 6px 16px; border-radius: 4px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; }
        .sap-btn-secondary { background-color: transparent; color: #0064d2; border: 1px solid #0064d2; padding: 6px 16px; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .sap-card { background: white; border: 1px solid #d9d9d9; border-radius: 4px; padding: 12px; box-shadow: 0px 2px 4px rgba(0,0,0,0.05); }
        .process-node { width: 160px; height: 180px; position: relative; }
        .process-node::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 0 20px 20px;
            border-color: transparent transparent #d9d9d9 #d9d9d9;
            box-shadow: -2px -2px 2px rgba(0,0,0,0.1);
        }
        .arrow-line { position: absolute; height: 2px; background-color: #0064d2; top: 50%; transform: translateY(-50%); z-index: 0; }
        .arrow-head { position: absolute; right: 0; top: 50%; transform: translateY(-50%) translateX(50%); width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 8px solid #0064d2; }
    </style>
